<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1 class="title">MY TASKS</h1>
    <div class="Createtask">
      <input
        type="text"
        name="newtask"
        id="newtask"
        placeholder="Add a new task"
      /><button id="button1" onclick="CreateTask()">➡️</button>
    </div>
    <h2 class="title">TO DO TASKS</h2>
    <div class="todotasks">
      <ul id="todolist" class="tasklist"></ul>
    </div>
    <h2 class="title">TASK COMPLETED</h2>
    <div class="todotask">
      <ul id="completedtask" class="tasklist"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
